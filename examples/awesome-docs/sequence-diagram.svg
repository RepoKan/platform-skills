<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" role="img" viewBox="0 0 900 400"><title>API Auth Sequence — Token Request Flow</title><desc>Animated sequence diagram: Client calls Auth service for a token, Auth calls IAM to validate credentials, then returns JWT to Client, which calls the API with the bearer token.</desc><style>@keyframes seq-show{0%,88%{opacity:1}94%{opacity:0}}.msg0,.msg1{animation:seq-show 12s linear infinite 0s;opacity:0}.msg1{animation:seq-show 12s linear infinite 3s}.msg1-ret{animation:seq-show 12s linear infinite 3.5s;opacity:0}.msg2,.msg3{animation:seq-show 12s linear infinite 6s;opacity:0}.msg3{animation:seq-show 12s linear infinite 9s}.msg3-ret{animation:seq-show 12s linear infinite 9.5s;opacity:0}</style><rect width="900" height="400" fill="#0d1117"/><text x="450" y="18" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">Auth Token Request Flow</text><rect width="100" height="34" x="50" y="28" fill="#161b22" stroke="#4a9eff" stroke-width="1.5" rx="6"/><text x="100" y="45" fill="#e6edf3" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">Client</text><rect width="100" height="34" x="300" y="28" fill="#161b22" stroke="#4a9eff" stroke-width="1.5" rx="6"/><text x="350" y="45" fill="#e6edf3" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">Auth</text><rect width="100" height="34" x="550" y="28" fill="#161b22" stroke="#79c0ff" stroke-width="1.5" rx="6"/><text x="600" y="45" fill="#e6edf3" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">IAM</text><rect width="100" height="34" x="800" y="28" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="6"/><text x="850" y="45" fill="#e6edf3" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">API</text><line x1="100" x2="100" y1="62" y2="380" stroke="#4a9eff" stroke-dasharray="4 4" stroke-width="1" opacity=".3"/><line x1="350" x2="350" y1="62" y2="380" stroke="#4a9eff" stroke-dasharray="4 4" stroke-width="1" opacity=".3"/><line x1="600" x2="600" y1="62" y2="380" stroke="#79c0ff" stroke-dasharray="4 4" stroke-width="1" opacity=".3"/><line x1="850" x2="850" y1="62" y2="380" stroke="#3fb950" stroke-dasharray="4 4" stroke-width="1" opacity=".3"/><defs><marker id="arr-req" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#4a9eff" d="M0,0 L0,6 L8,3 z"/></marker><marker id="arr-ret" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L0,6 L8,3 z"/></marker><marker id="arr-grn" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#3fb950" d="M0,0 L0,6 L8,3 z"/></marker></defs><g class="msg0"><line x1="104" x2="340" y1="110" y2="110" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-req)"/><text x="222" y="104" fill="#4a9eff" font-family="monospace" font-size="11" text-anchor="middle">POST /token {credentials}</text><rect width="12" height="50" x="344" y="110" fill="#4a9eff" opacity=".2"/></g><g class="msg1"><line x1="354" x2="590" y1="130" y2="130" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-req)"/><text x="472" y="124" fill="#4a9eff" font-family="monospace" font-size="11" text-anchor="middle">ValidateCredentials(sub)</text><rect width="12" height="46" x="594" y="130" fill="#79c0ff" opacity=".2"/></g><g class="msg1-ret"><line x1="590" x2="360" y1="176" y2="176" stroke="#8b949e" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#arr-ret)"/><text x="472" y="170" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">200 {claims, scopes}</text></g><g class="msg2"><line x1="340" x2="110" y1="220" y2="220" stroke="#8b949e" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#arr-ret)"/><text x="222" y="214" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">200 {access_token: JWT}</text><rect width="12" height="46" x="94" y="220" fill="#4a9eff" opacity=".2"/></g><g class="msg3"><line x1="104" x2="840" y1="280" y2="280" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-grn)"/><text x="472" y="274" fill="#3fb950" font-family="monospace" font-size="11" text-anchor="middle">GET /resource Authorization: Bearer &lt;JWT&gt;</text><rect width="12" height="46" x="844" y="280" fill="#3fb950" opacity=".2"/></g><g class="msg3-ret"><line x1="840" x2="110" y1="326" y2="326" stroke="#8b949e" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#arr-ret)"/><text x="472" y="320" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">200 {data}</text></g><text x="16" y="114" fill="#8b949e" font-family="monospace" font-size="10">1</text><text x="16" y="134" fill="#8b949e" font-family="monospace" font-size="10">2</text><text x="16" y="180" fill="#8b949e" font-family="monospace" font-size="10">3</text><text x="16" y="224" fill="#8b949e" font-family="monospace" font-size="10">4</text><text x="16" y="284" fill="#8b949e" font-family="monospace" font-size="10">5</text><text x="16" y="330" fill="#8b949e" font-family="monospace" font-size="10">6</text></svg>