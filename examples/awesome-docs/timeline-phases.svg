<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><title>Load Phases Timeline</title><desc>Timeline showing load phases with replica count chart: Idle (1 replica), Ramp (5 replicas), Peak (10 replicas)</desc><style>@keyframes bar-idle{0%,5%{opacity:.7}30%{opacity:0}}@keyframes bar-ramp{0%,29%,70%{opacity:0}35%,65%{opacity:.7}}@keyframes bar-peak{0%,64%{opacity:0}70%{opacity:.7}}</style><rect width="900" height="280" fill="#0d1117"/><text x="450" y="28" fill="#e6edf3" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Load Phases Timeline</text><rect width="800" height="6" x="50" y="50" fill="#21262d" rx="3"/><circle cx="50" cy="53" r="5" fill="#8b949e"/><circle cx="333" cy="53" r="5" fill="#4a9eff"/><circle cx="617" cy="53" r="5" fill="#f90"/><circle cx="850" cy="53" r="5" fill="#8b949e"/><text x="50" y="40" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Start</text><text x="333" y="40" fill="#4a9eff" font-family="sans-serif" font-size="11" text-anchor="middle">Ramp</text><text x="617" y="40" fill="#f90" font-family="sans-serif" font-size="11" text-anchor="middle">Peak</text><text x="850" y="40" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">End</text><line x1="50" x2="850" y1="230" y2="230" stroke="#21262d" stroke-width="1"/><line x1="50" x2="850" y1="202" y2="202" stroke="#21262d" stroke-width="1"/><line x1="50" x2="850" y1="160" y2="160" stroke="#21262d" stroke-width="1"/><line x1="50" x2="850" y1="118" y2="118" stroke="#21262d" stroke-width="1"/><line x1="50" x2="850" y1="90" y2="90" stroke="#21262d" stroke-width="1"/><text x="42" y="234" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="end">0</text><text x="42" y="206" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="end">2</text><text x="42" y="164" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="end">5</text><text x="42" y="122" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="end">8</text><text x="42" y="94" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="end">10</text><rect width="283" height="14" x="50" y="216" fill="#4a9eff" rx="2" style="animation:bar-idle 6s ease-in 0s both"/><rect width="284" height="70" x="333" y="160" fill="#f90" rx="2" style="animation:bar-ramp 6s ease-in 0s both"/><rect width="233" height="140" x="617" y="90" fill="#ff7b72" rx="2" style="animation:bar-peak 6s ease-in 0s both"/><text x="20" y="165" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90,20,165)">Replicas</text></svg>