<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><title>Platform Resource Field Explainer</title><desc>Animated field explainer carousel cycling through 4 config fields with YAML highlighting and tooltips</desc><style>@keyframes hl{0%,12%{opacity:1}15%{opacity:0}}@keyframes tip{0%,12%{opacity:1}15%{opacity:0}}@keyframes tipglow{0%{filter:drop-shadow(0 0 2px #4a9eff)}50%{filter:drop-shadow(0 0 8px #4a9eff)}}.hl0{animation:hl 8s ease-in-out infinite 0s;fill:#ffffff10}.hl1{animation:hl 8s ease-in-out infinite 2s}.hl1,.hl2,.hl3{fill:#ffffff10}.hl2{animation:hl 8s ease-in-out infinite 4s}.hl3{animation:hl 8s ease-in-out infinite 6s}.tip0{animation:tip 8s ease-in-out infinite 0s}.tip1{animation:tip 8s ease-in-out infinite 2s}.tip2{animation:tip 8s ease-in-out infinite 4s}.tip3{animation:tip 8s ease-in-out infinite 6s}.tipbox{animation:tipglow 3s ease-in-out infinite}</style><rect width="900" height="400" fill="#0d1117"/><rect width="400" height="360" x="20" y="20" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/><text x="40" y="50" fill="#8b949e" font-family="monospace" font-size="11"># Platform resource config</text><text x="40" y="75" fill="#f90" font-family="monospace" font-size="13">apiVersion: platform/v1</text><text x="40" y="100" fill="#f90" font-family="monospace" font-size="13">kind: Service</text><text x="40" y="125" fill="#4a9eff" font-family="monospace" font-size="13">name<tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">my-service</tspan></text><text x="40" y="150" fill="#4a9eff" font-family="monospace" font-size="13">replicas<tspan fill="#e6edf3">: </tspan><tspan fill="#f90">3</tspan></text><text x="40" y="175" fill="#4a9eff" font-family="monospace" font-size="13">image<tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">my-app:1.0.0</tspan></text><text x="40" y="200" fill="#4a9eff" font-family="monospace" font-size="13">port<tspan fill="#e6edf3">: </tspan><tspan fill="#f90">8080</tspan></text><rect width="390" height="22" x="25" y="115" class="hl0" rx="3"/><rect width="390" height="22" x="25" y="140" class="hl1" rx="3"/><rect width="390" height="22" x="25" y="165" class="hl2" rx="3"/><rect width="390" height="22" x="25" y="190" class="hl3" rx="3"/><g class="tip0 tipbox"><rect width="440" height="110" x="440" y="120" fill="#161b22" stroke="#4a9eff" stroke-width="1.5" rx="6"/><text x="460" y="147" fill="#4a9eff" font-family="monospace" font-size="14" font-weight="bold">name</text><text x="460" y="168" fill="#8b949e" font-family="sans-serif" font-size="12">Unique identifier for this service.</text><text x="460" y="185" fill="#8b949e" font-family="sans-serif" font-size="12">Must be unique within the namespace.</text><rect width="440" height="24" x="440" y="200" fill="#0d2233" rx="3"/><text x="460" y="217" fill="#79c0ff" font-family="monospace" font-size="11">Example: name: orders-service</text></g><g class="tip1 tipbox"><rect width="440" height="110" x="440" y="120" fill="#161b22" stroke="#f90" stroke-width="1.5" rx="6"/><text x="460" y="147" fill="#f90" font-family="monospace" font-size="14" font-weight="bold">replicas</text><text x="460" y="168" fill="#8b949e" font-family="sans-serif" font-size="12">Desired number of pod replicas.</text><text x="460" y="185" fill="#8b949e" font-family="sans-serif" font-size="12">Set to 0 for scale-to-zero workloads.</text><rect width="440" height="24" x="440" y="200" fill="#0d2233" rx="3"/><text x="460" y="217" fill="#f90" font-family="monospace" font-size="11">Example: replicas: 3</text></g><g class="tip2 tipbox"><rect width="440" height="110" x="440" y="120" fill="#161b22" stroke="#79c0ff" stroke-width="1.5" rx="6"/><text x="460" y="147" fill="#79c0ff" font-family="monospace" font-size="14" font-weight="bold">image</text><text x="460" y="168" fill="#8b949e" font-family="sans-serif" font-size="12">Container image reference.</text><text x="460" y="185" fill="#8b949e" font-family="sans-serif" font-size="12">Pin to an immutable digest in production.</text><rect width="440" height="24" x="440" y="200" fill="#0d2233" rx="3"/><text x="460" y="217" fill="#79c0ff" font-family="monospace" font-size="11">Example: image: my-app@sha256:abc123</text></g><g class="tip3 tipbox"><rect width="440" height="110" x="440" y="120" fill="#161b22" stroke="#4a9eff" stroke-width="1.5" rx="6"/><text x="460" y="147" fill="#4a9eff" font-family="monospace" font-size="14" font-weight="bold">port</text><text x="460" y="168" fill="#8b949e" font-family="sans-serif" font-size="12">Container port to expose.</text><text x="460" y="185" fill="#8b949e" font-family="sans-serif" font-size="12">Must match the application listen port.</text><rect width="440" height="24" x="440" y="200" fill="#0d2233" rx="3"/><text x="460" y="217" fill="#f90" font-family="monospace" font-size="11">Example: port: 8080</text></g></svg>