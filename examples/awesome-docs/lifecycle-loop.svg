<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310"><title>Platform Service Lifecycle Loop</title><desc>Animated lifecycle loop diagram showing 3-state cycling: idle, active scaling, and cooldown</desc><style>@keyframes glow-blue{0%{filter:drop-shadow(0 0 3px #4a9eff)}50%{filter:drop-shadow(0 0 12px #4a9eff)}}@keyframes glow-green{0%{filter:drop-shadow(0 0 3px #3fb950)}50%{filter:drop-shadow(0 0 12px #3fb950)}}@keyframes show-idle{0%,22%{opacity:1}27%{opacity:0}}@keyframes show-act{0%,27%,73%{opacity:0}32%,68%{opacity:1}}@keyframes show-cool{0%,72%{opacity:0}77%,95%{opacity:1}}@keyframes fp{0%{opacity:0;offset-distance:0}5%,95%{opacity:1}}.gb{animation:glow-blue 3s ease-in-out infinite}.gg{animation:glow-green 3s ease-in-out infinite}.s-idle{animation:show-idle 12s ease-in-out infinite both}.s-act{animation:show-act 12s ease-in-out infinite both}.s-cool{animation:show-cool 12s ease-in-out infinite both}.dot-poll,.dot-poll2{fill:#4a9eff;offset-path:path(&quot;M 130 110 L 240 110&quot;);offset-rotate:0deg;animation:fp 2s linear infinite 0s}.dot-poll2{animation:fp 2s linear infinite 1s}</style><defs><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#4a9eff" d="M0,0 L0,6 L8,3 z"/></marker><marker id="arr-r" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#ff7b72" d="M0,0 L0,6 L8,3 z"/></marker></defs><rect width="900" height="310" fill="#0d1117"/><rect width="110" height="70" x="20" y="75" fill="#161b22" stroke="#4a9eff" stroke-width="1.5" class="gb" rx="8"/><text x="75" y="115" fill="#e6edf3" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">Source</text><rect width="110" height="70" x="240" y="75" fill="#161b22" stroke="#4a9eff" stroke-width="1.5" class="gb" rx="8"/><text x="295" y="115" fill="#e6edf3" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">Operator</text><polygon fill="#161b22" stroke="#f90" stroke-width="1.5" points="450 85 480 110 450 135 420 110"/><text x="450" y="114" fill="#f90" dominant-baseline="central" font-size="10" text-anchor="middle">threshold?</text><text x="530" y="105" fill="#3fb950" font-family="sans-serif" font-size="11">YES</text><text x="455" y="165" fill="#ff7b72" font-family="sans-serif" font-size="11">NO</text><rect width="110" height="70" x="570" y="75" fill="#161b22" stroke="#3fb950" stroke-width="1.5" class="gg" rx="8"/><text x="625" y="110" fill="#e6edf3" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">Scale</text><rect width="110" height="70" x="760" y="75" fill="#161b22" stroke="#3fb950" stroke-width="1.5" class="gg" rx="8"/><g class="s-idle"><text x="815" y="115" fill="#8b949e" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">1 pod</text></g><g class="s-act"><text x="815" y="115" fill="#3fb950" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">5 pods</text></g><g class="s-cool"><text x="815" y="115" fill="#f90" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">3 pods</text></g><rect width="140" height="50" x="380" y="170" fill="#161b22" stroke="#ff7b72" stroke-dasharray="4 3" stroke-width="1" rx="8"/><text x="450" y="199" fill="#ff7b72" dominant-baseline="central" font-family="monospace" font-size="11" text-anchor="middle">no action</text><line x1="130" x2="235" y1="110" y2="110" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr)"/><line x1="350" x2="417" y1="110" y2="110" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr)"/><line x1="483" x2="565" y1="110" y2="110" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/><line x1="680" x2="755" y1="110" y2="110" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/><line x1="450" x2="450" y1="135" y2="165" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arr-r)"/><circle r="4" class="dot-poll"/><circle r="4" class="dot-poll2"/><rect width="900" height="30" x="0" y="258" fill="#161b22"/><g class="s-idle"><text x="450" y="278" fill="#8b949e" font-family="sans-serif" font-size="12" text-anchor="middle">Metric below threshold — no scaling action</text></g><g class="s-act"><text x="450" y="278" fill="#3fb950" font-family="sans-serif" font-size="12" text-anchor="middle">Metric above threshold — scaling up to target</text></g><g class="s-cool"><text x="450" y="278" fill="#f90" font-family="sans-serif" font-size="12" text-anchor="middle">Cooldown period — holding current replica count</text></g></svg>