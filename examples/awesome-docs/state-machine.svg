<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" role="img" viewBox="0 0 900 360"><title>Deployment State Machine</title><desc>Animated state machine: Pending → Deploying → Healthy, with error paths to Failed and a self-loop Retry from Failed back to Deploying. Current state cycles with a glowing ring highlight.</desc><style>@keyframes cur-ring{0%,20%{opacity:1;stroke-width:4}26%{opacity:0;stroke-width:1.5}}.cur0,.cur1{animation:cur-ring 12s ease-in-out infinite 0s;opacity:0}.cur1{animation:cur-ring 12s ease-in-out infinite 3s}.cur2,.cur3{animation:cur-ring 12s ease-in-out infinite 6s;opacity:0}.cur3{animation:cur-ring 12s ease-in-out infinite 9s}</style><rect width="900" height="360" fill="#0d1117"/><text x="450" y="18" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">Deployment State Machine</text><defs><marker id="arr-sm" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L0,6 L8,3 z"/></marker><marker id="arr-err" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#ff7b72" d="M0,0 L0,6 L8,3 z"/></marker><marker id="arr-ret" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#f90" d="M0,0 L0,6 L8,3 z"/></marker></defs><circle cx="130" cy="190" r="44" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/><circle cx="130" cy="190" r="37" fill="none" stroke="#8b949e" stroke-width="1" opacity=".35"/><text x="130" y="190" fill="#e6edf3" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">Pending</text><circle cx="130" cy="190" r="50" fill="none" stroke="#4a9eff" class="cur0"/><circle cx="350" cy="190" r="44" fill="#161b22" stroke="#f90" stroke-width="1.5"/><text x="350" y="190" fill="#f90" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">Deploying</text><circle cx="350" cy="190" r="50" fill="none" stroke="#4a9eff" class="cur1"/><circle cx="600" cy="190" r="44" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><circle cx="600" cy="190" r="30" fill="#3fb950" opacity=".15"/><text x="600" y="190" fill="#3fb950" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">Healthy</text><circle cx="600" cy="190" r="50" fill="none" stroke="#4a9eff" class="cur2"/><circle cx="490" cy="310" r="44" fill="#161b22" stroke="#ff7b72" stroke-width="1.5"/><text x="490" y="310" fill="#ff7b72" dominant-baseline="central" font-family="monospace" font-size="12" text-anchor="middle">Failed</text><circle cx="490" cy="310" r="50" fill="none" stroke="#4a9eff" class="cur3"/><line x1="174" x2="300" y1="190" y2="190" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr-sm)"/><text x="237" y="182" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">deploy</text><line x1="394" x2="550" y1="190" y2="190" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-sm)"/><text x="472" y="182" fill="#3fb950" font-family="monospace" font-size="10" text-anchor="middle">rollout complete</text><line x1="375" x2="462" y1="226" y2="280" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arr-err)"/><text x="398" y="262" fill="#ff7b72" font-family="monospace" font-size="10" text-anchor="middle">probe fail</text><line x1="575" x2="530" y1="226" y2="278" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arr-err)"/><text x="577" y="264" fill="#ff7b72" font-family="monospace" font-size="10" text-anchor="middle">health fail</text><path fill="none" stroke="#f90" stroke-width="1.5" marker-end="url(#arr-ret)" d="M 450,278 A 100 100 0 0 1 340,234"/><text x="368" y="298" fill="#f90" font-family="monospace" font-size="10" text-anchor="middle">retry</text><rect width="860" height="22" x="20" y="330" fill="#161b22" opacity=".6" rx="4"/><circle cx="40" cy="341" r="5" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="50" y="345" fill="#8b949e" font-family="monospace" font-size="10">transition</text><circle cx="155" cy="341" r="5" fill="#3fb950" opacity=".7"/><text x="165" y="345" fill="#3fb950" font-family="monospace" font-size="10">terminal</text><circle cx="250" cy="341" r="5" fill="none" stroke="#ff7b72" stroke-width="1.5"/><text x="260" y="345" fill="#ff7b72" font-family="monospace" font-size="10">error path</text><circle cx="360" cy="341" r="5" fill="none" stroke="#f90" stroke-width="1.5"/><text x="370" y="345" fill="#f90" font-family="monospace" font-size="10">retry path</text><circle cx="455" cy="341" r="5" fill="none" stroke="#4a9eff" stroke-width="2"/><text x="465" y="345" fill="#4a9eff" font-family="monospace" font-size="10">current state</text></svg>